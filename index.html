<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KantinKenangan — SMAN 1 BANGKALAN</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="description" content="Kantin SMAN 1 BANGKALAN — Sistem Pemesanan" />
</head>
<body>
  <header>
    <h1 class="gradient">KantinKenangan — SMAN 1 BANGKALAN</h1>
  </header>

  <h1>
    <div class="logo-container">
      <img src="https://c.termai.cc/i94/pR65b.png" class="logo-img" alt="Logo">
      <span class="logo-text">Menu Kantin Kenangan Smansaba</span>
    </div>
  </h1>

  <div id="toast-container"></div>

  <div class="container">
    <nav>
      <button id="nav-pembeli">Halaman Pembeli</button>
      <button id="nav-penjual">Halaman Penjual</button>
    </nav>

    <!-- ========== PAGE: PEMBELI ========== -->
    <main id="page-pembeli" class="card">
      <section class="center">
        <h2 class="menu-title">🍽️ Menu Makanan & Minuman</h2>
      </section>

      <section class="card">
        <div class="input-name-box">
          <label>Nama Pembeli:</label>
          <input id="input-nama" type="text" placeholder="Masukkan nama (wajib)" />
        </div>
      </section>

      <section class="card">
        <div class="produk-grid" id="produk-grid"></div>
      </section>

      <section class="center">
        <button id="btn-pesan" class="btn-primary">Pesan Sekarang</button>
        <p id="summary" class="muted"></p>
      </section>
    </main>

    <!-- ========== PAGE: PENJUAL ========== -->
    <aside id="page-penjual" class="card" style="display:none">
      <section class="center">
        <h2 class="white-title">📥 Panel Penjual</h2>
      </section>

      <div id="seller-login" class="login-box card">
        <h3 class="center">Login Penjual</h3>
        <input id="seller-username" placeholder="Username" />
        <input id="seller-password" type="password" placeholder="Password" />
        <div class="login-btns">
          <button id="seller-login-btn" class="btn-primary">Login</button>
          <button id="seller-show-cred" class="btn-outline">Lihat Creds</button>
        </div>
        <p class="small center">Default: <strong>admin</strong> / <strong>1234</strong></p>
      </div>

      <div id="seller-dashboard" style="display:none">
        <div class="dashboard-btns">
          <button id="seller-logout" class="btn-outline">Logout</button>
          <button id="export-csv" class="btn-outline">Export CSV</button>
          <button id="clear-all" class="btn-primary">Hapus Semua</button>
        </div>
        <div id="orders" class="orders-list"></div>
      </div>
    </aside>

    <div id="toast"></div>

    <footer>
      <h1 class="gradient" style="font-size:16px;">Made by Rifan — SupportBy Robotik, Smansaba</h1>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
